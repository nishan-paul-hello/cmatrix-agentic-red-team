name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend-ci:
    name: Frontend Tests & Build
    if: vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app-frontend/package-lock.json

      - name: Install Dependencies
        run: make install

      - name: Check Code Formatting (Prettier)
        run: npm --prefix app-frontend run format:check || echo "Prettier found issues, but continuing for now."

      - name: Run ESLint
        run: npm --prefix app-frontend run lint

      - name: Typecheck (TypeScript)
        run: make typecheck

      - name: Security Audit
        run: make audit

      - name: Build Next.js
        run: make build
