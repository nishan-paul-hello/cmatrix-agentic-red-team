StylesPath = styles
MinAlertLevel = suggestion
Vocab = Project

# Define which external style packages to download
Packages = Google, proselint, write-good

# Target all LaTeX files
[*.tex]
# Use standard spell checking and styles
BasedOnStyles = Vale, Google, proselint, write-good

# Tell Vale to ignore LaTeX commands and math mode so it doesn't flag them as typos
TokenIgnores = (\\[a-zA-Z]+(?:\[[^\]]*\])?(?:\{[^\}]*\})?), (\$[^$]+\$)

# Disable rules that conflict with standard thesis formatting (like 'Chapter')
Google.WordListCase = NO
Vale.Terms = NO
