<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RedGrid — Slide 01 — Title</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D1117;
    --surface:#161B22;
    --red:#FF3B3B;
    --cyan:#00D4FF;
    --amber:#FFB347;
    --text:#F0F6FC;
    --text2:#8B949E;
    --border:#30363D;
    --green:#3FB950;
    --blocked:#F85149;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    background:#05070A;
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Inter',sans-serif;
  }
  .stage{
    width:1280px;height:720px;
    position:relative;
    overflow:hidden;
    background:var(--bg);
    box-shadow:0 40px 120px rgba(0,0,0,.6);
  }
  /* hex / circuit pattern */
  .pattern{
    position:absolute;inset:0;
    opacity:0.05;
    background-image:
      repeating-linear-gradient(60deg, var(--red) 0 1px, transparent 1px 68px),
      repeating-linear-gradient(-60deg, var(--red) 0 1px, transparent 1px 68px),
      repeating-linear-gradient(0deg, var(--red) 0 1px, transparent 1px 68px);
    background-size:68px 120px;
    pointer-events:none;
  }
  .content{
    position:relative;z-index:2;
    height:100%;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    text-align:center;
    padding:0 80px;
  }
  .eyebrow{
    position:absolute;
    top:44px;left:64px;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    letter-spacing:0.02em;
    color:var(--text2);
    opacity:0;
    animation:fadeUp 500ms 1400ms ease forwards;
  }
  .title{
    font-family:'Syne',sans-serif;
    font-weight:800;
    font-size:104px;
    letter-spacing:-0.02em;
    color:var(--text);
    line-height:1;
  }
  .title span{ display:inline-block; }
  .subtitle{
    margin-top:26px;
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:22px;
    color:var(--cyan);
    max-width:760px;
    line-height:1.4;
    opacity:0;
    animation:fadeUp 600ms 900ms ease forwards;
  }
  .divider{
    width:0;
    height:2px;
    margin:36px 0;
    background:linear-gradient(90deg,var(--red),var(--cyan));
    animation:growLine 700ms 1200ms ease forwards;
  }
  @keyframes growLine{ to{ width:280px; } }
  .meta{
    opacity:0;
    animation:fadeUp 500ms 1500ms ease forwards;
    color:var(--text2);
    font-size:15px;
  }
  .meta .authors{
    color:var(--text);
    font-weight:600;
    font-size:16px;
    margin-bottom:6px;
  }
  .badge{
    position:absolute;
    bottom:56px;right:64px;
    background:rgba(255,59,59,0.12);
    border:1px solid var(--red);
    color:var(--red);
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    padding:8px 16px;
    border-radius:4px;
    opacity:0;
    animation:fadeUp 500ms 1600ms ease forwards;
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* glitch scramble effect on title */
  .glitch-char{
    display:inline-block;
    animation:settle 60ms steps(1) forwards;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="pattern"></div>
  <div class="eyebrow">MSc Thesis · Inception Stage · Sep 2026</div>

  <div class="content">
    <h1 class="title" id="glitchTitle"></h1>
    <p class="subtitle">Dependency-Constrained UCB Exploration for Autonomous Penetration Testing</p>
    <div class="divider"></div>
    <div class="meta">
      <div class="authors">[Author Names]</div>
      <div>[University Name] · Department of Computer Science</div>
    </div>
  </div>

  <div class="badge">EARLY STAGE — INCEPTION REPORT</div>
</div>

<script>
// Glitch/scramble-then-settle text animation for "RedGrid"
const target = "RedGrid";
const chars = "!<>-_\\/[]{}—=+*^?#________";
const el = document.getElementById('glitchTitle');
let frame = 0;
const totalFrames = 14;
const frameDelay = 45;

function render(f){
  let out = "";
  for(let i=0;i<target.length;i++){
    const revealFrame = 5 + i*1.1;
    if(f >= revealFrame){
      out += target[i];
    } else {
      out += chars[Math.floor(Math.random()*chars.length)];
    }
  }
  el.textContent = out;
}

function tick(){
  render(frame);
  frame++;
  if(frame <= totalFrames){
    setTimeout(tick, frameDelay);
  } else {
    el.textContent = target;
  }
}
tick();
</script>
</body>
</html>
