<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254">
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#520000"/>
    <stop offset=".18" stop-color="#9b0000"/>
    <stop offset=".38" stop-color="#ff1b00"/>
    <stop offset=".55" stop-color="#a40000"/>
    <stop offset=".72" stop-color="#ff2000"/>
    <stop offset="1" stop-color="#5b0000"/>
  </linearGradient>
  <linearGradient id="topFace" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a00000"/>
    <stop offset=".20" stop-color="#ef1000"/>
    <stop offset=".40" stop-color="#ff2d00"/>
    <stop offset=".58" stop-color="#f20f00"/>
    <stop offset=".80" stop-color="#cf0000"/>
    <stop offset="1" stop-color="#760000"/>
  </linearGradient>
  <linearGradient id="rightFace" x1="0" y1="0" x2="1" y2=".8">
    <stop offset="0" stop-color="#6c0000"/>
    <stop offset=".20" stop-color="#e50000"/>
    <stop offset=".48" stop-color="#ff2d00"/>
    <stop offset=".72" stop-color="#d90000"/>
    <stop offset="1" stop-color="#680000"/>
  </linearGradient>
  <linearGradient id="lowerFace" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff2b00"/>
    <stop offset=".28" stop-color="#ff2d00"/>
    <stop offset=".52" stop-color="#d40000"/>
    <stop offset=".78" stop-color="#8c0000"/>
    <stop offset="1" stop-color="#410000"/>
  </linearGradient>
  <linearGradient id="edgeLight" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
    <stop offset=".18" stop-color="#ff2d00" stop-opacity=".75"/>
    <stop offset=".42" stop-color="#ff2000" stop-opacity=".55"/>
    <stop offset="1" stop-color="#7d0000" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="sphere" cx="34%" cy="28%" r="78%">
    <stop offset="0" stop-color="#ff2d00"/>
    <stop offset=".10" stop-color="#ff2d00"/>
    <stop offset=".25" stop-color="#ff2000"/>
    <stop offset=".48" stop-color="#e00000"/>
    <stop offset=".74" stop-color="#a40000"/>
    <stop offset="1" stop-color="#520000"/>
  </radialGradient>
  <radialGradient id="sphereGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#ff2d00" stop-opacity=".85"/>
    <stop offset=".55" stop-color="#ff1100" stop-opacity=".18"/>
    <stop offset="1" stop-color="#ff0000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".88"/>
    <stop offset=".22" stop-color="#ff2d00" stop-opacity=".42"/>
    <stop offset=".55" stop-color="#ff2000" stop-opacity=".08"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <filter id="metalLight" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
    <feSpecularLighting in="blur" surfaceScale="7" specularConstant=".75" specularExponent="28" lighting-color="#ffffff" result="spec">
      <feDistantLight azimuth="225" elevation="55"/>
    </feSpecularLighting>
    <feComposite in="spec" in2="SourceAlpha" operator="in" result="specClip"/>
    <feBlend in="SourceGraphic" in2="specClip" mode="screen"/>
  </filter>
  <clipPath id="mainClip"><path d="M 546,68 532,70 499,83 455,115 398,174 303,264 258,304 123,416 101,441 90,461 83,486 83,508 86,523 97,550 114,576 136,601 203,661 309,762 362,802 389,817 409,825 465,838 504,842 541,842 582,834 588,827 585,821 556,811 534,800 485,764 295,593 282,578 279,571 281,547 286,536 293,528 440,414 529,340 539,335 567,357 567,382 583,402 648,452 768,550 866,635 899,668 910,686 907,694 523,911 498,928 479,950 474,966 475,984 484,1005 504,1028 572,1089 598,1107 628,1117 654,1117 668,1114 693,1104 735,1076 792,1028 1022,848 1092,788 1123,757 1155,714 1168,683 1174,638 1171,556 1166,529 1160,515 1148,501 1137,493 857,360 848,354 859,320 862,300 862,264 858,243 850,216 842,200 832,185 809,164 781,148 709,121 606,75 580,68 Z"/></clipPath>
  <clipPath id="sphereClip"><path d="M 619,495 598,498 582,503 549,522 533,538 522,554 514,570 507,596 505,621 508,637 519,665 531,682 550,701 568,713 586,721 617,727 640,727 666,722 681,716 700,704 720,685 730,671 739,653 745,633 747,605 745,588 736,561 720,534 703,518 690,510 668,500 640,495 Z"/></clipPath>
</defs>

