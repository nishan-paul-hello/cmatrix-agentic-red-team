<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RedGrid — Slide 20 — Thank You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;background:#E0DDD8;display:flex;align-items:center;justify-content:center;}
  
  .slide{
    width:1280px;height:720px;background:#F7F4EF;color:#1A1A2E;
    position:relative;overflow:hidden;box-shadow:0 8px 48px rgba(0,0,0,.18);
    display: flex; flex-direction: column; padding: 60px 80px;
  }

  /* Grid Watermark */
  .grid-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image: 
      linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0; pointer-events: none;
  }

  .content-layer {
    position: relative; z-index: 1; display: flex; flex-direction: column; width: 100%; height: 100%;
  }

  /* Header */
  .header-zone {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    margin-top: auto; margin-bottom: auto;
  }
  .proj-brand {
    font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; color: #8B1A1A;
    letter-spacing: 0.15em; margin-bottom: 16px;
  }
  .ty-huge {
    font-family: 'Source Sans 3', sans-serif; font-size: 110px; font-style: normal; font-weight: 700;
    color: #1A1A2E; line-height: 1; margin-bottom: 20px; letter-spacing: -0.02em;
  }
  .qa-sub {
    font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; color: #8B1A1A;
    letter-spacing: 0.2em; text-transform: uppercase;
  }

  .divider {
    width: 100%; height: 1px; background: #D4CFC8; margin-bottom: 20px;
  }

  /* Final Premium Dashboard */
  .final-dashboard {
    display: flex; flex-direction: column; gap: 20px; width: 100%;
  }

  /* Stats Row */
  .dash-stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px;
  }
  .stat-card {
    background: #FFFFFF;
    border: 1px solid #D4CFC8; border-top: 2px solid #9A9AAA;
    border-radius: 12px; padding: 16px 20px;
    display: flex; flex-direction: column; box-shadow: 0 4px 16px rgba(0,0,0,0.05);
  }
  
  .sc-head {
    display: flex; justify-content: space-between; align-items: center; width: 100%;
    border-bottom: 1px dashed #D4CFC8; padding-bottom: 10px; margin-bottom: 12px;
  }
  .sc-icon {
    width: 32px; height: 32px; border-radius: 8px; background: rgba(0,0,0,0.04);
    display: flex; align-items: center; justify-content: center;
  }
  
  .stat-card .s-num {
    font-family: 'Playfair Display', serif; font-size: 40px; font-weight: 700; color: #1A1A2E; line-height: 1;
  }
  .stat-card .s-lbl {
    font-family: 'Source Sans 3', sans-serif; font-size: 12px; font-weight: 700; color: #6B6B7A;
    text-transform: uppercase; letter-spacing: 0.05em; line-height: 1.4; align-self: flex-end; text-align: right;
  }

  /* Terms Row */
  .dash-terms {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
  }

  /* Term Card */
  .term-card {
    background: #FFFFFF;
    border: 1px solid #D4CFC8; border-left: 3px solid #8B1A1A;
    border-radius: 8px; padding: 16px;
    display: flex; gap: 16px; align-items: flex-start;
  }
  .tc-icon {
    width: 40px; height: 40px; border-radius: 50%; background: rgba(139,26,26,0.08);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .tc-content { display: flex; flex-direction: column; }
  .term-card .t-key {
    font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 700; color: #8B1A1A;
    margin-bottom: 4px; letter-spacing: 0.05em;
  }
  .term-card .t-def {
    font-family: 'Source Sans 3', sans-serif; font-size: 17px; font-weight: 400; color: #3A3A4A;
    line-height: 1.4;
  }

  /* Authors Colophon */
  .authors-block {
    margin-top: auto; margin-bottom: 10px;
    display: flex; flex-direction: column; gap: 6px;
    border-left: 4px solid #8B1A1A; padding: 18px 24px;
    background: rgba(255, 255, 255, 0.65);
    border-radius: 0 12px 12px 0;
    box-shadow: 0 8px 32px rgba(0,0,0,0.04);
    width: fit-content;
  }
  .author-names {
    font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; color: #1A1A2E;
    letter-spacing: 0.02em; margin-bottom: 4px;
  }
  .author-meta {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; color: #5A5A6A;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .author-meta .sep { color: #8B1A1A; margin: 0 8px; font-weight: 700; }
  
  /* Footer */
  .footer-line{position:absolute;bottom:36px;left:0;right:0;height:1px;background:#D4CFC8;}
  .footer-num{position:absolute;right:80px;bottom:10px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#9A9AAA;font-weight:600;}
  .progress{position:absolute;bottom:0;left:0;height:4px;background:#8B1A1A;z-index: 10;}
</style>
</head>
<body>
<div class="slide">
  <!-- The Subtle Geometric Grid Watermark -->
  <div class="grid-overlay"></div>

  <div class="content-layer">
    
    <div class="header-zone">
      <div class="proj-brand">RedGrid</div>
      <div class="ty-huge">Thank You</div>
      <div class="qa-sub">Floor Open For Questions</div>
    </div>



    <!-- Authors Colophon -->
    <div class="authors-block">
      <div class="author-names">Nishan Paul and Md Rakibur Rahman</div>
      <div class="author-meta">University of Dhaka</div>
      <div class="author-meta" style="margin-top: 2px;">Professional Masters in Information and Cyber Security (PMICS)</div>
      <div class="author-meta" style="margin-top: 2px;">CSE 810: Project on Cyber Security</div>
    </div>
  </div>
  
  <div class="footer-line"></div>
  <div class="footer-num">20 / 21</div>
  <div class="progress" style="width: 95%;"></div>

</div>
</body>
</html>
