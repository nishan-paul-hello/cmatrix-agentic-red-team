name: redgrid

services:
  frontend:
    image: ghcr.io/nishan-paul-2022/redgrid-agentic-red-team/app-frontend:latest
    ports:
      - "${FRONTEND_PORT:-3011}:3000"
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - main_network

networks:
  main_network:
    external: true
